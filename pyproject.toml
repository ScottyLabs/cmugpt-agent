[project]
name = "cmugpt-agent"
version = "0.1.0"
description = "Bark Agent for CMU campus information"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.22.0",
  "httpx>=0.28.1",
  "mcp>=1.28.1,<2.0.0",
  "openai>=1.108.0",
  "pydantic>=2.12.5",
  "python-dotenv>=1.1.1",
  "langgraph>=1.2.4",
  "langchain-openai>=1.3.0",
  "langchain-core>=1.4.4",
  "langchain-mcp-adapters>=0.3.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6",
]

[project.scripts]
cmugpt-agent = "cmugpt.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.11.10",
    "ty>=0.0.1a2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cmugpt"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ruff]
src = ["src"]
fix = true
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true

# https://docs.astral.sh/ruff/linter/#rule-selection
[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]

