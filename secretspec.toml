[project]
name = "cmugpt-agent"
revision = "1.0"

[profiles.default]
OPENROUTER_API_KEY = { description = "OpenRouter API key", required = true }
MCP_SERVER_URL = { description = "MCP server base URL", required = true }
AGENT_SHARED_SECRET = { description = "Bearer token for /agent/respond*", required = false }
# Persistent user memory. Both optional: without OPENAI_API_KEY memory still
# works but recall degrades from semantic search to recency; without
# DATABASE_URL the store is in-memory (non-durable) instead of Postgres+pgvector.
OPENAI_API_KEY = { description = "OpenAI key for memory embeddings (text-embedding-3-small)", required = false }
DATABASE_URL = { description = "Postgres URL (pgvector) for the durable memory store", required = false }

[profiles.dev]

[profiles.prod]

[profiles.staging]

[profiles.preview]

[providers]
local = "dotenv://.env"
vault = "vault://secrets2.scottylabs.org/secret"
