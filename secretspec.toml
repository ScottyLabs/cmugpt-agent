[project]
name = "cmugpt-agent"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
OPENROUTER_API_KEY = { description = "OpenRouter API key", required = true }
MCP_SERVER_URL = { description = "MCP server base URL", required = true }
# Without it, /agent/* and /memory/* refuse requests (HTTP 503), so every deployed profile, including staging and preview, needs a value in OpenBao.
AGENT_SHARED_SECRET = { description = "Bearer token for /agent/* and /memory/*", required = false }
ALLOWED_ORIGINS = { description = "Comma-separated browser origins allowed via CORS", default = "https://cmugpt.com", required = false }
# Memory embeddings. Optional: without it, recall degrades from semantic search to recency. DATABASE_URL is deliberately absent: Kennel injects it into the environment, and a secret-store value would override it.
OPENAI_API_KEY = { description = "OpenAI key for memory embeddings (text-embedding-3-large)", required = false }

[profiles.dev]
# Local development may run without AGENT_SHARED_SECRET.
AGENT_ALLOW_UNAUTHENTICATED = { description = "Accept unauthenticated requests (local development only)", default = "1", required = false }

[profiles.prod]
# AGENT_ENV=production makes startup fail without DATABASE_URL and an
# AGENT_SHARED_SECRET of at least 32 characters. The default applies when
# OpenBao holds no value.
AGENT_ENV = { description = "Deployment environment flag", default = "production", required = false }

[profiles.staging]

[profiles.preview]
