[project]
name = "cmugpt-agent"
revision = "1.0"

[profiles.ci.defaults]
required = false

[profiles.ci]
OPENROUTER_API_KEY = { required = false }
MCP_SERVER_URL = { required = false }

[profiles.default]
OPENROUTER_API_KEY = { description = "OpenRouter API key", required = true }
MCP_SERVER_URL = { description = "MCP server base URL", required = true }
AGENT_SHARED_SECRET = { description = "Bearer token for /agent/respond*", required = false }
ALLOWED_ORIGINS = { description = "Comma-separated browser origins allowed via CORS", default = "https://cmugpt.com", required = false }
# Memory embeddings. Optional: without it, recall degrades from semantic
# search to recency. DATABASE_URL is deliberately absent: Kennel injects it
# into the environment, and a secret-store value would override it.
OPENAI_API_KEY = { description = "OpenAI key for memory embeddings (text-embedding-3-large)", required = false }

[profiles.dev]

[profiles.prod]

[profiles.staging]

[profiles.preview]

[providers]
local = "dotenv://.env"
vault = "vault://secrets.scottylabs.org/secret"
